name: deploy

# Runs only when a PR is merged into production: checks, then publish and deploy.
on:
  push:
    branches:
      - production

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # `composer setup` copies .env.example, which points at the Docker MySQL.
    # There is none here, so migrate runs on SQLite, like the tests.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # Same as docker/php/Dockerfile.prod; composer.lock needs >= 8.4.
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # Builds the production images and publishes them to GHCR, so the servers
  # only pull them (docs/deploy.md). Runs after the checks pass.
  publish:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        target: [app, nginx]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 is the E2.1.Micro. Add linux/arm64 when moving to the A1.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile.prod
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/juliocesaraquino/wishlisti-${{ matrix.target }}:latest
            ghcr.io/juliocesaraquino/wishlisti-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  # Updates the server to this commit's images over SSH (docs/deploy.md).
  # Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # The micro compose file; switch to docker-compose.prod.yml on the A1.
      # nginx is restarted too, in case the app container got a new IP.
      - name: Deploy
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$DEPLOY_TARGET" bash -se <<'EOF'
          set -euo pipefail
          cd ~/wishlisti
          git fetch -q origin production
          git reset -q --hard ${{ github.sha }}
          export WISHLISTI_TAG=${{ github.sha }}
          dcp() { docker compose -f docker-compose.micro-app.yml "$@"; }
          dcp pull -q
          dcp up -d --remove-orphans
          dcp exec -T app php artisan migrate --force
          dcp restart nginx
          docker image prune -f
          EOF
