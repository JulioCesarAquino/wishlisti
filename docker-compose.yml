# Fixed project name: keeps container/volume names stable even if the
# project folder is renamed.
name: wishlisti

services:
    app:
        build:
            context: ./docker/php
            args:
                UID: ${UID:-1001}
                GID: ${GID:-1001}
        container_name: wishlisti_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        networks:
            - wishlisti
        depends_on:
            - mysql
            - redis

    # Runs the Laravel scheduler (routes/console.php), e.g. the daily trash:purge.
    scheduler:
        build:
            context: ./docker/php
            args:
                UID: ${UID:-1001}
                GID: ${GID:-1001}
        container_name: wishlisti_scheduler
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan schedule:work
        volumes:
            - .:/var/www/html
        networks:
            - wishlisti
        depends_on:
            - mysql
            - redis

    nginx:
        image: nginx:alpine
        container_name: wishlisti_nginx
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - wishlisti
        depends_on:
            - app

    mysql:
        image: mysql:8.4
        container_name: wishlisti_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-wishlisti}
            MYSQL_USER: ${DB_USERNAME:-wishlisti}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        volumes:
            - wishlisti_mysql_data:/var/lib/mysql
        networks:
            - wishlisti
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-u',
                    'root',
                    '-p${DB_ROOT_PASSWORD:-secret}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: wishlisti_redis
        restart: unless-stopped
        networks:
            - wishlisti

    node:
        build:
            context: ./docker/php
            args:
                UID: ${UID:-1001}
                GID: ${GID:-1001}
        container_name: wishlisti_node
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev"
        ports:
            - '5173:5173'
        volumes:
            - .:/var/www/html
        networks:
            - wishlisti
        profiles:
            - dev

networks:
    wishlisti:
        driver: bridge

volumes:
    wishlisti_mysql_data:
