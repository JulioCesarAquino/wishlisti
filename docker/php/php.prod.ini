expose_php = Off
memory_limit = 256M

; Same limit as client_max_body_size in docker/nginx/default.conf.
upload_max_filesize = 20M
post_max_size = 20M

; The code never changes inside the image, so OPcache never has to re-check files.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
